name: Dependabot auto-merge

# Dependabot's own `pull_request` runs get a read-only token and cannot read Actions
# secrets, so this listens on `pull_request_target`, which runs the copy of this file
# on main. Nothing from the pull request is checked out or executed here.
on: pull_request_target

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: read
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # A merge made with GITHUB_TOKEN does not trigger the CI run on main, so the
      # merge is left to a GitHub App instead.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --auto "$PR_URL"
